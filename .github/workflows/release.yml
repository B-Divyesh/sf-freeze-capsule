name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and test
        shell: bash
        run: |
          cargo test --locked
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/freeze-capsule" stage/
          cp LICENSE README.md stage/
          tar -C stage -czf "freeze-capsule-${{ matrix.asset }}.tar.gz" freeze-capsule LICENSE README.md
      - name: Package macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp "target/${{ matrix.target }}/release/freeze-capsule" pkgroot/usr/local/bin/
          pkgbuild --root pkgroot --identifier in.sociobot.freeze-capsule --version "${RELEASE_TAG#v}" "freeze-capsule-${{ matrix.asset }}.pkg"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/freeze-capsule.exe" stage/
          Copy-Item LICENSE,README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "freeze-capsule-${{ matrix.asset }}.zip"
      - name: Build deb and rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/freeze-capsule" ./freeze-capsule
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          VERSION="${RELEASE_TAG#v}" "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target "freeze-capsule_${RELEASE_TAG#v}_amd64.deb"
          VERSION="${RELEASE_TAG#v}" "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager rpm --target "freeze-capsule-${RELEASE_TAG#v}-1.x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            freeze-capsule-${{ matrix.asset }}.tar.gz
            freeze-capsule-${{ matrix.asset }}.zip
            freeze-capsule-${{ matrix.asset }}.pkg
            freeze-capsule_*.deb
            freeze-capsule-*.rpm
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums and package manifests
        shell: bash
        run: |
          cd release-assets
          sha256sum freeze-capsule-* > SHA256SUMS
          version="${RELEASE_TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          node -e 'const fs=require("fs");const [version,base]=process.argv.slice(1);const sums=Object.fromEntries(fs.readFileSync("SHA256SUMS","utf8").trim().split("\n").map(x=>{const [h,n]=x.trim().split(/\s+/);return[n,h]}));fs.writeFileSync("latest.json",JSON.stringify({version,assets:Object.entries(sums).map(([name,sha256])=>({name,sha256,url:`${base}/${name}`}))},null,2)+"\n")' "$version" "$base"
          win_hash="$(awk '$2 ~ /windows-x86_64.zip$/ {print $1}' SHA256SUMS)"
          mac_arm_hash="$(awk '$2 ~ /macos-aarch64.tar.gz$/ {print $1}' SHA256SUMS)"
          mac_x64_hash="$(awk '$2 ~ /macos-x86_64.tar.gz$/ {print $1}' SHA256SUMS)"
          linux_hash="$(awk '$2 ~ /linux-x86_64.tar.gz$/ {print $1}' SHA256SUMS)"
          sed -e "s/0.1.0/$version/g" -e "0,/RELEASE_WORKFLOW_REPLACES_THIS/s//$mac_arm_hash/" -e "0,/RELEASE_WORKFLOW_REPLACES_THIS/s//$mac_x64_hash/" -e "0,/RELEASE_WORKFLOW_REPLACES_THIS/s//$linux_hash/" ../homebrew/Formula/freeze-capsule.rb > freeze-capsule.rb
          sed -e "s/0.1.0/$version/g" -e "s/RELEASE_WORKFLOW_REPLACES_THIS/$win_hash/" ../scoop-bucket/freeze-capsule.json > freeze-capsule.json
          mkdir winget
          cp ../winget/*.yaml winget/
          sed -i "s/0.1.0/$version/g;s/RELEASE_WORKFLOW_REPLACES_THIS/$win_hash/" winget/*.yaml
          tar -czf freeze-capsule-winget-manifests.tar.gz -C winget .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/*
      - name: Publish Homebrew tap when token is available
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; formula remains attached to the release."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/B-Divyesh/homebrew-freeze-capsule.git" tap
          mkdir -p tap/Formula
          cp release-assets/freeze-capsule.rb tap/Formula/freeze-capsule.rb
          cd tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/freeze-capsule.rb
          git commit -m "freeze-capsule ${RELEASE_TAG}" || exit 0
          git push
